<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/verity.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A trusted beginning with Verity. Register, verify your identity document, and complete a guided live selfie check in one workspace." />
    <meta name="theme-color" content="#193d36" />
    <title>Verity — Your identity workspace</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('verity-theme')
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', savedTheme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
